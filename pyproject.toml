[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frameglass"
version = "0.1.0"
description = "A quiet, detailed media inspector for the desktop"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7", "numpy>=2,<3", "Pillow>=12,<13"]

[project.scripts]
frameglass = "frameglass.app:main"

[tool.setuptools.packages.find]
include = ["frameglass*"]
